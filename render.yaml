# Render Blueprint: free web service. NOTE: the free plan has no persistent disk, so the SQLite database
# (accounts, saved menus) is wiped whenever the service restarts or redeploys. Fine for a demo only.
services:
  - type: web
    name: little-bites
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: ANTHROPIC_API_KEY   # will be replaced by the Gemini key later
        sync: false
