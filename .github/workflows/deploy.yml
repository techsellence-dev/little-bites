name: Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'deploy/littlebites-backup.*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      INSTANCE_ID: i-0b5838a132da6c3a9
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Run deploy on the instance (SSM)
        run: |
          ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name littlebites-deploy \
            --query Command.CommandId --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 4
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output text
          [ "$STATUS" = "Success" ]
      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 3 https://littlebites.techsellence.in/ -o /dev/null && echo "site up"
