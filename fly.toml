# Fly.io config for Little Bites. `fly launch --copy-config --no-deploy` will ask you to pick the app name.
# SQLite + in-memory rate limits mean this must run as exactly ONE machine (see README, "Before real users").
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[mounts]
  source = "lb_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
